name: Deploy BKS26 Volunteer Guide

on:
  push:
    branches: [main]
    paths:
      - 'projects/bks26-volunteer/site/**'
      - '.github/workflows/deploy-bks26-guide.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Publish the site folder as the root of gh-pages. This is non-destructive
      # for /sockwave: everything at the root is replaced except sockwave/ (owned
      # by deploy-sockwave.yml) and .nojekyll. GitHub Pages serves the branch.
      - name: Publish to gh-pages root
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          SITE="projects/bks26-volunteer/site"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # The guide must not ship its own sockwave/ folder: it would collide
          # with the Sockwave deploy.
          if [ -e "$SITE/sockwave" ]; then
            echo "::error::$SITE/sockwave collides with the Sockwave deploy path"
            exit 1
          fi

          # Create gh-pages if it does not exist yet, then add a worktree on it.
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git fetch --no-tags "$REMOTE" gh-pages:gh-pages
            git worktree add ghp gh-pages
          else
            git worktree add --orphan -b gh-pages ghp
          fi

          find ghp -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name sockwave ! -name .nojekyll -exec rm -rf {} +
          cp -r "$SITE"/. ghp/
          touch ghp/.nojekyll

          cd ghp
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "deploy: bks26 volunteer guide (${GITHUB_SHA})"
            git push "$REMOTE" gh-pages
          fi
