name: Deploy BKS26 Volunteer Guide

on:
  push:
    branches: [main]
    paths:
      - 'projects/bks26-volunteer/site/**'
      - '.github/workflows/deploy-bks26-guide.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Publish the site folder as the root of gh-pages. The branch is a
      # parentless snapshot, force-replaced on each deploy; GitHub Pages
      # serves it (source: gh-pages branch).
      - name: Push site to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          SITE_TREE=$(git rev-parse "HEAD:projects/bks26-volunteer/site")
          COMMIT=$(git commit-tree "$SITE_TREE" -m "deploy: bks26 volunteer guide (${GITHUB_SHA})")
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${COMMIT}:refs/heads/gh-pages"
