<title>Design Studio Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: same two-pane console as the live studio, plus a Studio / Compare switch in the header. */
:root {
  --bg: #f5f6f4; --panel: #ffffff; --ink: #1b1f1d; --muted: #5d6662; --line: #dde1de;
  --accent: #1f5f8b; --accent-ink: #ffffff; --good: #1d7a46; --warn: #a35f00; --bad: #b3261e;
  --f-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121514; --panel: #1a1e1c; --ink: #e8ece9; --muted: #9aa39f; --line: #2c322f;
    --accent: #6fb3e0; --accent-ink: #0b1a24; --good: #5fcf8e; --warn: #f0b45a; --bad: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121514; --panel: #1a1e1c; --ink: #e8ece9; --muted: #9aa39f; --line: #2c322f;
  --accent: #6fb3e0; --accent-ink: #0b1a24; --good: #5fcf8e; --warn: #f0b45a; --bad: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
header.top > div { min-width: 0; }
.eyebrow { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--warn); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3vw, 30px); margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.engine-note { font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.controls { display: flex; flex-direction: column; gap: 20px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 900px) { .controls { position: static; } }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 0 0 8px; display: block; }
select, input[type="text"] { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.mono { font-family: var(--f-mono) !important; flex: 1; min-width: 0; }
select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.preset { text-align: left; font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.preset b { font-weight: 600; }
.preset small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.swatches { display: flex; gap: 3px; }
.swatches i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(127,127,127,.35); }
.dial { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; margin-bottom: 12px; }
.dial span.v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13px; min-width: 2ch; text-align: right; }
.dial input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.dial .ends { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
input[type="color"] { width: 44px; height: 36px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: var(--bg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; border: 0; background: var(--bg); color: var(--ink); padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { color: var(--muted); cursor: not-allowed; }
.right { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.read { font-family: var(--f-display); font-size: 17px; font-weight: 500; line-height: 1.4; margin: 0; text-wrap: balance; }
.read em { font-style: normal; color: var(--accent); }
.stage { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.pv { background: var(--p-bg); color: var(--p-text); font-family: var(--p-body); padding: calc(var(--p-space) * 3); display: flex; flex-direction: column; gap: calc(var(--p-space) * 2.5); }
.pv * { transition: transform var(--p-dur) ease, box-shadow var(--p-dur) ease, background var(--p-dur) ease; }
.pv nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; }
.pv nav .logo { font-family: var(--p-display); font-weight: var(--p-dw); font-size: 18px; text-transform: var(--p-case); }
.pv nav .links { display: flex; gap: calc(var(--p-space) * 1.5); color: var(--p-muted); flex-wrap: wrap; }
.pv .hero { display: grid; gap: calc(var(--p-space) * 2); grid-template-columns: var(--p-hero-cols); align-items: center; text-align: var(--p-align); }
.pv .hero > * { min-width: 0; }
.pv h2 { font-family: var(--p-display); font-weight: var(--p-dw); font-size: var(--p-h); line-height: 1.05; margin: 0 0 calc(var(--p-space)); letter-spacing: var(--p-track); text-transform: var(--p-case); text-wrap: balance; }
.pv p { margin: 0 0 calc(var(--p-space) * 1.5); color: var(--p-muted); max-width: 52ch; }
.pv .hero .copy p { margin-inline: var(--p-pmargin); }
.pv .ctas { display: flex; gap: 10px; flex-wrap: wrap; justify-content: var(--p-justify); }
.pv .btn { font: inherit; font-weight: 600; border-radius: var(--p-radius); padding: calc(var(--p-space) * .8) calc(var(--p-space) * 1.6); border: var(--p-bw) solid var(--p-border); cursor: pointer; background: var(--p-surface); color: var(--p-text); }
.pv .btn.primary { background: var(--p-accent); color: var(--p-on-accent); border-color: var(--p-accent); }
.pv .btn:hover { transform: translateY(var(--p-lift)); }
.pv .art { aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--p-radius); background: var(--p-surface); border: var(--p-bw) solid var(--p-border); box-shadow: var(--p-shadow); display: grid; place-items: center; padding: var(--p-space); }
.pv .art .metric { font-family: var(--p-display); font-size: clamp(28px, 5vw, 44px); font-weight: var(--p-dw); color: var(--p-accent); font-variant-numeric: tabular-nums; }
.pv .art small { display: block; color: var(--p-muted); text-align: center; }
.pv .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: calc(var(--p-space) * 1.5); }
.pv .card { background: var(--p-surface); border: var(--p-bw) solid var(--p-border); border-radius: var(--p-radius); padding: calc(var(--p-space) * 1.5); box-shadow: var(--p-shadow); }
.pv .card:hover { transform: translateY(var(--p-lift)); }
.pv .card h3 { font-family: var(--p-display); font-weight: var(--p-dw); margin: 0 0 6px; font-size: 17px; text-transform: var(--p-case); }
.pv .card p { margin: 0; font-size: 14px; }
.pv .card .tag { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--p-accent); margin-bottom: 6px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .pv * { transition: none !important; } .pv .btn:hover, .pv .card:hover { transform: none; } }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.pill.ok { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.check div { min-width: 0; }
.check b, .cmp td b { display: block; font-weight: 600; }
.check span.d, .cmp span.d { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.out-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.tabs { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.tabs button, .copy-btn, .fix { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.copy-btn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.fix { display: inline-flex; align-items: center; gap: 8px; border-color: var(--warn); color: var(--warn); font-weight: 600; font-variant-numeric: tabular-nums; }
.fix i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(127,127,127,.35); }
.wheel { display: grid; grid-template-columns: repeat(auto-fill, minmax(26px, 1fr)); gap: 4px; }
.wheel button { aspect-ratio: 1; max-width: 100%; border: 1px solid rgba(127,127,127,.35); border-radius: 5px; cursor: pointer; padding: 0; }
.wheel button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
pre.code { margin: 0; overflow-x: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.55; max-height: 420px; white-space: pre; }
.hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.status { font-size: 12px; color: var(--good); min-height: 1em; }
.tablewrap { overflow-x: auto; }
table.cmp { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 13px; }
table.cmp th, table.cmp td { text-align: left; vertical-align: top; padding: 10px 12px; border-top: 1px solid var(--line); }
table.cmp thead th { border-top: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
table.cmp tbody th { font-weight: 600; white-space: nowrap; }
table.cmp.num td:not(:first-child) { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
<div id="root"></div>
