    --font-size-base: 1rem;        /* 16px, was 14px */
    --duration-fast: 150ms;        /* was 175ms */
    --duration-medium: 300ms;      /* was 410ms */
    --duration-slow: 500ms;
  }
  @media (pointer: coarse) {
    button { min-height: 44px; }   /* touch target */
  }
}
